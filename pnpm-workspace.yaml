# Сборка pnpm: разрешаем postinstall-скрипты только тем пакетам, которым они нужны.
# Prisma генерирует клиент и скачивает движок, esbuild ставит бинарник.
# Без этого pnpm install падает с ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true

# Патчи зависимостей, которые приходят транзитивно через next/react-simple-maps.
overrides:
  postcss@<=8.5.22: 8.5.33
  d3-color@<3.1.0: 3.1.1
  zod@<4.6.6: 4.6.7
